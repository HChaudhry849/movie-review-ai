name: Train and Run Model

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 0️⃣ Start infrastructure
      - name: Build and start services
        run: docker compose up --build -d

      # 1️⃣ Wait for SEED to complete
      # seed-service exits when done → this is the strongest signal
      - name: Wait for seed-service
        run: |
          echo "Waiting for seed-service to complete..."
          docker compose wait seed-service

      # 2️⃣ Wait for Ollama SERVER to be healthy
      - name: Wait for Ollama server
        run: |
          echo "Waiting for Ollama server healthcheck..."
          for i in {1..60}; do
            STATUS=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              movie-review-ai-ollama-server-1 || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "Ollama server is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Ollama server did not become healthy"
          exit 1

      # 3️⃣ Wait for Ollama DATA GENERATION (training.done)
      - name: Wait for Ollama data generation
        run: |
          echo "Waiting for /app/data/training.done..."
          for i in {1..120}; do
            if docker compose exec -T ollama-service \
              test -f /app/data/training.done; then
              echo "training.done detected"
              exit 0
            fi
            sleep 5
          done
          echo "training.done not created"
          exit 1

      # 4️⃣ Wait for TRAINING to finish (training.complete)
      - name: Wait for training to complete
        run: |
          echo "Waiting for /app/data/training.complete..."
          for i in {1..180}; do
            if docker compose exec -T training-service \
              test -f /app/data/training.complete; then
              echo "training.complete detected"
              exit 0
            fi
            sleep 10
          done
          echo "training did not complete"
          exit 1

      # 5️⃣ Wait for Flask to be healthy
      - name: Wait for Flask service
        run: |
          echo "Waiting for Flask /health..."
          for i in {1..60}; do
            if curl -f http://localhost:5000/health; then
              echo "Flask is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Flask did not become healthy"
          exit 1

      # 🔍 Observability (always useful)
      - name: Docker status
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color